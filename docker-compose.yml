services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./qdrant_storage:/qdrant/storage:z

    restart: unless-stopped

  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - 8000:8000
    environment:
      QDRANT_URL: http://qdrant:6333
      PHOTOS_DIR: /app/photos
      # Persist the HuggingFace cache (CLIP + sentence-transformer weights) across
      # container recreates so models aren't re-downloaded every restart.
      HF_HOME: /app/.hf_cache
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./api/src:/app/api/src
      - ./data/raw/photos:/app/photos:ro
      - ./.hf_cache:/app/.hf_cache

  streamlit-app:
    build:
      context: .
      dockerfile: chatbot_ui/Dockerfile
    ports:
      - 8501:8501
    environment:
      # In-cluster URL the Streamlit process uses to call the FastAPI service.
      API_URL: http://api:8000
      # Browser-facing URL the user's browser uses to fetch <img src="..."> photos.
      PUBLIC_API_URL: http://localhost:8000
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./chatbot_ui/src:/app/chatbot_ui/src

  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: langgraph_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: langgraph_db
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/data:z

  restaurants_mcp_server:
    platform: linux/amd64
    build:
      context: .
      dockerfile: restaurants_mcp_server/Dockerfile
    ports:
      - 8001:8000
    env_file:
      - .env
    restart: unless-stopped
  

  reviews_mcp_server:
    build:
      context: .
      dockerfile: reviews_mcp_server/Dockerfile
    ports:
      - 8002:8000
    env_file:
      - .env
    restart: unless-stopped

